# Site
name: 'Molly Purcell-Weatherwalks'
description: 'Pardot / Salesforce Marketing Cloud Account Engagement and HubSpot admin. I trace CRM problems across systems and document what fixed them.'
logo: 'assets/images/logo.svg'
favicon: 'assets/images/logo.svg'
url: 'https://mollypw.com'
baseurl: ''
avatar: 'assets/images/sal.jpg'
email: 'purcell.molly@gmail.com'
author:
  name: 'Molly Purcell-Weatherwalks'
social:
  name: 'Molly Purcell-Weatherwalks'
  links:
    - 'https://www.linkedin.com/in/purcell-molly'
    - 'https://github.com/MollyPW'

include: ["_pages"]
permalink: /:title/

# Plugins
plugins: 
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag
 
# Defaults
defaults:

  # all posts
  - scope:
      path: "_posts"
    values:
      layout: post
      
  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page
      
      
# Syntax
markdown: kramdown
highlighter: rouge

# Pagination
paginate: 20


# Exclude metadata and development time dependencies (like Grunt plugins)
exclude: [README.markdown, package.json, grunt.js, Gruntfile.js, Gruntfile.coffee, node_modules]
